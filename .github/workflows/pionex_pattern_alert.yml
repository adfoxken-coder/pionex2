name: Pionex Pattern Alert

on:
  schedule:
    # 台北時間(UTC+8)每天 06:00~23:59,每 15 分鐘執行一次
    # 換算成 UTC:22:00(前一天)~ 15:59(當天),因跨過 UTC 午夜分成兩段 hour 範圍
    # GitHub 排程有時會延遲幾分鐘,屬正常現象
    - cron: "*/15 0-15,22,23 * * *"
  workflow_dispatch: {}   # 允許手動點擊執行,方便測試

# 同一時間只允許一個執行中的 run,新的排程/手動觸發會排隊等前一個跑完,
# 不會同時搶著 push pattern_state.json 造成 git 衝突
concurrency:
  group: pionex-pattern-alert
  cancel-in-progress: false

permissions:
  contents: write   # 需要寫入權限,才能把 pattern_state.json 的更新推回 repo

jobs:
  check-pattern-alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pattern alert script
        env:
          TELEGRAM_BOT_TOKEN_2: ${{ secrets.TELEGRAM_BOT_TOKEN_2 }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
        run: python pattern_alert.py

      - name: Commit updated pattern_state.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pattern_state.json
          git diff --staged --quiet || git commit -m "Update pattern state [skip ci]"
          git pull --rebase origin main
          git push
